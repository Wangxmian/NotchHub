name: Clipboard parity validation
on:
  push:
    branches: [clipboard-maccy-parity]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.2 Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Build native application and extract App Intents metadata
        run: |
          if ! xcodebuild -project NotchToolbox/NotchToolbox.xcodeproj \
            -scheme NotchToolbox -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES MACOSX_DEPLOYMENT_TARGET=13.0 \
            build > native-build.log 2>&1; then
            python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('native-build.log').read_text(errors='replace').splitlines()
          errors = [line for line in lines if 'error:' in line]
          for line in (errors or lines[-25:])[:40]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + escaped)
          PYCODE
            exit 1
          fi
      - name: Run existing native module tests
        run: |
          if ! xcodebuild -project NotchToolbox/NotchToolbox.xcodeproj \
            -scheme NotchToolbox -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build -only-testing:NotchToolboxTests \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES MACOSX_DEPLOYMENT_TARGET=13.0 \
            test > native-tests.log 2>&1; then
            python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('native-tests.log').read_text(errors='replace').splitlines()
          errors = [line for line in lines if 'error:' in line or 'failed' in line.lower()]
          for line in (errors or lines[-25:])[:40]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
            exit 1
          fi
      - name: Run clipboard behavior regression
        if: success() || failure()
        run: python3 NotchToolbox/LocalBuild/verify.py ClipboardRegression.swift > clipboard-regression.log 2>&1
      - name: Run Pomodoro regression
        if: success() || failure()
        run: python3 NotchToolbox/LocalBuild/verify.py > pomodoro-regression.log 2>&1
      - name: Verify App Intents metadata is present
        if: success() || failure()
        run: test -d build/Build/Products/Release/NotchHub.app/Contents/Resources/Metadata.appintents
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-logs
          path: |
            native-build.log
            native-tests.log
            clipboard-regression.log
            pomodoro-regression.log
